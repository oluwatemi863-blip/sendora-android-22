name: Build Sendora APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir project
          unzip -q "untitled (3).zip" -d project
          echo "Project files:"
          find project -maxdepth 5 -type f | head -300

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find Android project
        run: |
          echo "Searching for Gradle project..."
          find project -name gradlew -type f -print
          find project -name settings.gradle -o -name settings.gradle.kts -print

      - name: Build Android APK
        run: |
          GRADLEW=$(find project -name gradlew -type f -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found."
            echo "The ZIP may contain another folder level."
            exit 1
          fi

          APP_DIR=$(dirname "$GRADLEW")

          echo "Android project found at: $APP_DIR"

          cd "$APP_DIR"

          chmod +x gradlew

          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "APK files found:"
          find project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sendora-debug-APK
          path: project/**/*.apk
          if-no-files-found: error

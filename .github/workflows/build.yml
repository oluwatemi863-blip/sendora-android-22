name: Build SENDORA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SENDORA-debug-APK
          path: app/build/outputs/apk/debug/*.apk        run: |
          GRADLEW=$(find project -name gradlew -type f -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found."
            echo "The ZIP may contain another folder level."
            exit 1
          fi

          APP_DIR=$(dirname "$GRADLEW")

          echo "Android project found at: $APP_DIR"

          cd "$APP_DIR"

          chmod +x gradlew

          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "APK files found:"
          find project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sendora-debug-APK
          path: project/**/*.apk
          if-no-files-found: error
